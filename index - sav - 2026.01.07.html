<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POI Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: #f5f5f0;
            color: #1a1a1a;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ===== SLIDES ===== */
        .slide {
            display: none;
            position: fixed;
            inset: 0;
            flex-direction: column;
        }
        .slide.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== LOAD SLIDE ===== */
        .slide-load {
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            background: #1e3a5f;
            color: white;
        }
        .load-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }
        .load-group {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            text-align: left;
        }
        .load-label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }
        .load-input {
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }
        .load-btn {
            width: 100%;
            max-width: 320px;
            padding: 1rem;
            background: #e07b39;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1rem;
            cursor: pointer;
        }

        /* ===== HOME SLIDE ===== */
        .slide-home {
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            color: white;
        }
        .home-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .home-icon svg {
            width: 40px;
            height: 40px;
        }
        .home-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        .home-count {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .home-distance {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* ===== OVERVIEW SLIDE ===== */
        .slide-overview {
            background: #1e3a5f;
        }
        .overview-header {
            padding: 1rem 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }
        .overview-icon {
            width: 40px;
            height: 40px;
            background: #e07b39;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overview-icon svg {
            width: 22px;
            height: 22px;
            color: white;
        }
        .overview-title {
            flex: 1;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .overview-map-container {
            flex: 1;
            position: relative;
            margin-bottom: 80px;
        }
        #overview-map {
            height: 100%;
            width: 100%;
        }
        .overview-legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255,255,255,0.95);
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-height: 50%;
            overflow-y: auto;
		    pointer-events: auto; /* Permet de scroller sans bouger la carte derrière */
        }
        .overview-legend-title {
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #1e3a5f;
        }
        .overview-legend-item {
			padding: 4px 0;
			border-bottom: 1px solid #eee;
			display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
		.overview-legend-item:last-child {
			border-bottom: none;
		}
        .overview-legend-color {
            width: 20px;
            height: 4px;
            border-radius: 2px;
        }


		.overview-legend-poi {
			width: 20px;
			height: 20px;
			background: #1e3a5f;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			font-weight: 700;
			font-size: 0.65rem;
			flex-shrink: 0;
		}
        /* ===== MAP SLIDE ===== */
        .slide-map {
            background: #1e3a5f;
        }
        .map-header {
            padding: 1rem 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }
        .map-num {
            width: 40px;
            height: 40px;
            background: #e07b39;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .map-title {
            flex: 1;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .map-parent-badge {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
        }
        .map-container {
            flex: 1;
            position: relative;
            margin-bottom: 80px; /* Espace pour la nav-bar */
        }
        #the-map {
            height: 100%;
            width: 100%;
        }

        /* ===== CARTO VIEW (pour POIs sur image) - Style similaire à Leaflet ===== */
        .carto-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
            margin-bottom: 80px; /* Espace pour la nav-bar */
        }
        .carto-viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        .carto-viewport:active {
            cursor: grabbing;
        }
        .carto-transform-layer {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }
        .carto-image-container {
            position: relative;
            display: inline-block;
        }
        .carto-image {
            display: block;
            max-width: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .carto-marker {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #e07b39;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            transform: translate(-50%, -50%);
            z-index: 10;
            animation: markerPulse 2s infinite;
            pointer-events: none;
        }
        @keyframes markerPulse {
            0%, 100% { box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 3px 20px rgba(224,123,57,0.6); }
        }

        /* Contrôles de zoom style Leaflet */
        .carto-zoom-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .carto-zoom-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            transition: background 0.2s;
        }
        .carto-zoom-btn:hover {
            background: #f4f4f4;
        }
        .carto-zoom-btn:active {
            background: #e0e0e0;
        }
        .carto-zoom-btn:first-child {
            border-bottom: 1px solid #ccc;
        }
        .carto-zoom-btn:disabled {
            color: #bbb;
            cursor: not-allowed;
        }
        
        /* Bouton reset zoom */
        .carto-reset-btn {
            position: absolute;
            top: 80px;
            left: 10px;
            z-index: 100;
            width: 30px;
            height: 30px;
            border: none;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
        }
        .carto-reset-btn:hover {
            background: #f4f4f4;
        }

        /* ===== PHOTO SUR LE PLAN ===== */
        .carto-photo-container {
            position: absolute;
            z-index: 15;
            max-width: 120px;
            display: none;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            cursor: grab;
            pointer-events: auto;
        }
        .carto-photo-container:active {
            cursor: grabbing;
        }
        .carto-photo-container.visible {
            display: block;
        }
        .carto-photo {
            width: 100%;
            height: auto;
            display: block;
        }

        .carto-connector {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: visible;
        }
        .carto-connector line {
            stroke: #e07b39;
            stroke-width: 2;
            stroke-dasharray: 4 2;
        }

        /* ===== PHOTOS SUR CARTE LEAFLET ===== */
        .leaflet-photo-box {
            position: absolute;
            max-width: 120px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            z-index: 1000;
			pointer-events: auto;
			cursor: grab;
			display: none;
        }
		.leaflet-photo-box:active {
			cursor: grabbing;
		}
        .leaflet-photo-box.visible {
            display: block;
        }
        .leaflet-photo-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .leaflet-photo-box {
            padding: 0.3rem 0.4rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            background: #1e3a5f;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .leaflet-photo-box.current .photo-label {
            background: #e07b39;
        }
        .leaflet-connector-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            overflow: visible;
        }
        .leaflet-connector-svg line {
            stroke: #e07b39;
            stroke-width: 2;
            stroke-dasharray: 4 2;
        }

        /* ===== DETAILS SLIDE ===== */
        .slide-details {
            background: #fff;
        }
        .details-header {
            padding: 1rem 1.5rem;
            background: #1e3a5f;
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .details-num {
            width: 40px;
            height: 40px;
            background: #e07b39;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .details-title {
            flex: 1;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .details-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            padding-bottom: 120px;
        }
        .details-photo {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }
        .details-photo.hidden { display: none; }
        .details-parent-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0f4f8;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #1e3a5f;
        }
        .details-parent-info svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .details-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .details-tag {
            background: rgba(30,58,95,0.1);
            color: #1e3a5f;
            padding: 0.4rem 0.9rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .details-coords {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .details-coords svg {
            width: 18px;
            height: 18px;
            color: #e07b39;
        }
        .details-desc {
            line-height: 1.7;
            font-size: 1.05rem;
        }
        .details-desc img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
        }
        .details-desc figure {
            margin: 1.5rem 0;
        }
        .details-desc figcaption {
            font-style: italic;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 0.15rem;
            padding: 0 1rem;
        }

        /* ===== ROUTE SLIDE ===== */
        .slide-route {
            background: #e8f4f8;
        }
        .route-header {
            padding: 1rem 1.5rem;
            background: #1e3a5f;
            color: white;
        }
        .route-label {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .route-label svg {
            width: 24px;
            height: 24px;
        }
        .route-subtitle {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-top: 0.25rem;
        }
        .route-distance {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-top: 0.25rem;
            font-weight: 600;
            color: #e07b39;
        }
        .route-map-container {
            flex: 1;
            position: relative;
            margin-bottom: 80px; /* Espace pour la nav-bar */
        }
        #route-map {
            height: 100%;
            width: 100%;
        }

        /* ===== NAV BAR ===== */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: white;
            display: flex;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:active {
            background: rgba(0,0,0,0.05);
        }
        .nav-btn svg {
            width: 36px;
            height: 36px;
            color: #1e3a5f;
        }
        .nav-btn:disabled svg {
            color: #ccc;
        }
        .nav-btn.home-btn {
            flex: 0.6;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
        }
        .nav-btn.home-btn svg {
            width: 28px;
            height: 28px;
        }
        .nav-btn.list-btn {
            flex: 0.6;
            border-right: 1px solid #eee;
        }
        .nav-btn.list-btn svg {
            width: 26px;
            height: 26px;
        }
        .nav-btn.next-btn {
            background: #e07b39;
        }
        .nav-btn.next-btn:active {
            background: #c96a2f;
        }
        .nav-btn.next-btn svg {
            color: white;
        }
        .nav-btn.next-btn:disabled {
            background: #ddd;
        }

        /* ===== MARKERS ===== */
        .poi-marker {
            width: 40px;
            height: 40px;
            background: #1e3a5f;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-family: 'DM Sans', sans-serif;
        }
        .poi-marker.current {
            background: #e07b39;
        }
        .poi-marker.small {
            width: 30px;
            height: 30px;
            font-size: 12px;
        }
        .user-marker {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(59,130,246,0.5);
        }

        /* ===== POI LIST MODAL ===== */
        .poi-list-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.2s ease;
        }
        .poi-list-modal.active {
            display: flex;
            flex-direction: column;
        }
        .poi-list-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 80vh;
            background: white;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .poi-list-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .poi-list-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e3a5f;
        }
        .poi-list-close {
            width: 36px;
            height: 36px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poi-list-close svg {
            width: 20px;
            height: 20px;
            color: #666;
        }
        .poi-list-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
            padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
        }
        .poi-list-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .poi-list-item:hover,
        .poi-list-item:active {
            background: #f5f5f5;
        }
        .poi-list-item.current {
            background: #fff7ed;
        }
        .poi-list-num {
            width: 36px;
            height: 36px;
            background: #1e3a5f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .poi-list-item.current .poi-list-num {
            background: #e07b39;
        }
        .poi-list-info {
            flex: 1;
            min-width: 0;
        }

		/* Pour les étiquettes sous les photos (Cartes et Plan) */
		.photo-label, .carto-photo-label {
			padding: 0.4rem 0.5rem;
			font-size: 0.75rem;
			font-weight: 600;
			text-align: center;
			background: #1e3a5f;
			color: white;
			/* On supprime nowrap et ellipsis pour permettre le retour à la ligne */
			white-space: normal; 
			word-wrap: break-word;
			line-height: 1.2;
		}

		/* Pour la légende de la vue d'ensemble */
		.overview-legend-text {
			color: #333;
			font-size: 0.8rem;
			/* On permet au texte de prendre toute la place nécessaire */
			white-space: normal; 
			word-wrap: break-word;
			max-width: 180px; 
			line-height: 1.2;
		}

		/* Pour la liste complète des POIs (Modal) */
		.poi-list-name {
			font-size: 1rem;
			font-weight: 600;
			color: #1a1a1a;
			/* On affiche le nom complet ici aussi */
			white-space: normal;
			word-wrap: break-word;
			line-height: 1.3;
		}

        .poi-list-meta {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.15rem;
        }
        .poi-list-arrow {
            width: 20px;
            height: 20px;
            color: #ccc;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- SLIDE: LOAD -->
    <div id="slide-load" class="slide slide-load active">
        <h1 class="load-title">🗺️ POI Navigator</h1>
        <div class="load-group">
            <div class="load-label">Fichier POIs</div>
            <input type="file" id="file-pois" class="load-input" accept=".json">
        </div>
        <div class="load-group">
            <div class="load-label">Fichier Routes</div>
            <input type="file" id="file-routes" class="load-input" accept=".json">
        </div>
        <button class="load-btn" onclick="loadFiles()">Charger →</button>
    </div>

    <!-- SLIDE: HOME -->
    <div id="slide-home" class="slide slide-home">
        <div class="home-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let allPois = [];
        let pois = [];
        let route = null;
        let userLoc = null;
        let map = null;
        let routeMap = null;
        let overviewMap = null;
        let mapMarkerCoords = null;
        let routeMarkerFromCoords = null;
        let routeMarkerToCoords = null;
        let sequence = [];
        let currentStep = 0;
		let userMarkerMap = null;
		let userMarkerRoute = null;
        let userMarkerOverview = null;

        const CONFIG = { imagesPath: './images/' };

        // Palette de couleurs pour les segments
        const SEGMENT_COLORS = [
            '#e07b39', // orange
            '#3b82f6', // bleu
            '#10b981', // vert
            '#8b5cf6', // violet
            '#ef4444', // rouge
            '#f59e0b', // ambre
            '#06b6d4', // cyan
            '#ec4899', // rose
            '#84cc16', // lime
            '#6366f1', // indigo
            '#14b8a6', // teal
            '#f97316', // orange vif
        ];

		// État du drag pour les photos Leaflet
		let dragState = null;

        // ===== État du viewer carto (zoom/pan) =====
        let cartoState = {
            scale: 1,
            translateX: 0,
            translateY: 0,
            minScale: 0.5,
            maxScale: 5,
            imageWidth: 0,
            imageHeight: 0,
            containerWidth: 0,
            containerHeight: 0,
            // Pour le drag
            isDragging: false,
            startX: 0,
            startY: 0,
            startTranslateX: 0,
            startTranslateY: 0,
            // Pour le pinch zoom
            initialPinchDistance: 0,
            initialScale: 1,
            // Position du marqueur
            markerX: 0,
            markerY: 0,
            hasMarker: false
        };

		function initPhotoDrag(photoBoxId, updateFn) {
			const box = document.getElementById(photoBoxId);
			if (!box) return;
			
			const onStart = (e) => {
				e.preventDefault();
				const touch = e.touches ? e.touches[0] : e;
				dragState = {
					box: box,
					startX: touch.clientX - box.offsetLeft,
					startY: touch.clientY - box.offsetTop,
					updateFn: updateFn
				};
				box.style.cursor = 'grabbing';
			};
			
			box.addEventListener('mousedown', onStart);
			box.addEventListener('touchstart', onStart, { passive: false });
		}

		document.addEventListener('mousemove', (e) => {
			if (!dragState) return;
			const x = e.clientX - dragState.startX;
			const y = e.clientY - dragState.startY;
			dragState.box.style.left = x + 'px';
			dragState.box.style.top = y + 'px';
			if (dragState.updateFn) dragState.updateFn();
		});

		document.addEventListener('touchmove', (e) => {
			if (!dragState) return;
			const touch = e.touches[0];
			const x = touch.clientX - dragState.startX;
			const y = touch.clientY - dragState.startY;
			dragState.box.style.left = x + 'px';
			dragState.box.style.top = y + 'px';
			if (dragState.updateFn) dragState.updateFn();
		}, { passive: false });

		document.addEventListener('mouseup', () => {
			if (dragState) dragState.box.style.cursor = 'grab';
			dragState = null;
		});

		document.addEventListener('touchend', () => {
			if (dragState) dragState.box.style.cursor = 'grab';
			dragState = null;
		});

        function isCartoPoi(poi) {
            return poi.parentCartoId && poi.x != null && poi.y != null;
        }

        // POI enfant d'un parent carto, mais sans position x/y propre
        function isCartoChildWithoutXY(poi) {
            return poi.parentCartoId && (poi.x == null || poi.y == null);
        }

        function hasGeoCoords(poi) {
            return poi.lat != null && poi.lng != null;
        }

        function getParentPoi(poi) {
            if (!poi.parentCartoId) return null;
            return allPois.find(p => p.id === poi.parentCartoId);
        }

        function getCartoImage(poi) {
            const parent = getParentPoi(poi);
            return parent?.cartoImage || null;
        }

        function getEffectiveCoords(poi) {
            if (hasGeoCoords(poi)) {
                return { lat: poi.lat, lng: poi.lng };
            }
            const parent = getParentPoi(poi);
            if (parent && hasGeoCoords(parent)) {
                return { lat: parent.lat, lng: parent.lng, inherited: true };
            }
            return null;
        }

        function hasValidPath(fromIndex, toIndex) {
            const segment = route?.segments?.find(s => s.index === fromIndex);
            if (segment && segment.path && segment.path.length >= 2) return true;
            const segKey = fromIndex.toString();
            const path = route?.segmentPaths?.[segKey];
            return path && path.length >= 2;
        }

        function formatDistance(meters) {
            if (meters < 1000) return Math.round(meters) + ' m';
            return (meters / 1000).toFixed(1) + ' km';
        }

        function processDescriptionHtml(html) {
            if (!html) return '<p>Pas de description.</p>';
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            tempDiv.querySelectorAll('figure[data-img-name]').forEach(figure => {
                const imgName = figure.getAttribute('data-img-name');
                if (imgName) {
                    const img = figure.querySelector('img');
                    if (img) img.setAttribute('src', CONFIG.imagesPath + imgName);
                }
            });
            tempDiv.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith(CONFIG.imagesPath) || src.startsWith('http') || src.startsWith('data:')) return;
                let newSrc = src.startsWith('./') ? src.substring(2) : src;
                newSrc = newSrc.startsWith('images/') ? './' + newSrc : CONFIG.imagesPath + newSrc;
                img.setAttribute('src', newSrc);
            });
            return tempDiv.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            tryAutoLoad();
            setupKeyboard();
            startGeo();
            initCartoControls();
            document.getElementById('poi-list-modal').addEventListener('click', e => {
                if (e.target.id === 'poi-list-modal') closePoiList();
            });
        });

        async function tryAutoLoad() {
            try {
                const [p, r] = await Promise.all([
                    fetch('pois.json').then(x => x.json()),
                    fetch('routes.json').then(x => x.json())
                ]);
                initApp(p, r);
            } catch (e) {}
        }

        function loadFiles() {
            const f1 = document.getElementById('file-pois').files[0];
            const f2 = document.getElementById('file-routes').files[0];
            if (!f1 || !f2) return alert('Sélectionnez les 2 fichiers');
            Promise.all([readJSON(f1), readJSON(f2)])
                .then(([p, r]) => initApp(p, r))
                .catch(e => alert('Erreur: ' + e));
        }

        function readJSON(file) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = e => { try { res(JSON.parse(e.target.result)); } catch(x) { rej(x); } };
                r.onerror = rej;
                r.readAsText(file);
            });
        }

        function initApp(poisData, routesData) {
            allPois = poisData.pois || poisData;
            route = Array.isArray(routesData) ? routesData[0] : (routesData.routes?.[0] || routesData);
            if (route?.poiIds) {
                pois = route.poiIds.map(id => allPois.find(x => x.id === id)).filter(Boolean);
            } else {
                pois = allPois;
            }
            buildSequence();
            document.getElementById('home-title').textContent = route?.name || 'Parcours';
            document.getElementById('home-count').textContent = pois.length + ' points d\'intérêt';
            
            // Calculer et afficher la distance totale du parcours
            let totalDistance = 0;
            if (route?.segments) {
                route.segments.forEach(seg => {
                    if (seg.distance) totalDistance += seg.distance;
                });
            }
            const distanceEl = document.getElementById('home-distance');
            if (totalDistance > 0) {
                distanceEl.innerHTML = '🚶 ' + formatDistance(totalDistance) + ' de marche';
            } else {
                distanceEl.textContent = '';
            }
            
            document.getElementById('nav-bar').style.display = 'flex';
            currentStep = 0;
            showStep();
        }

        function buildSequence() {
            sequence = [{ type: 'home' }];
            
            // Ajouter la page overview juste après home
            sequence.push({ type: 'overview' });
            
            for (let i = 0; i < pois.length; i++) {
                const poi = pois[i];
                
                // Vérifier si le POI précédent a un trajet vers ce POI
                let hasIncomingRoute = false;
                if (i > 0) {
                    const prevSegment = route?.segments?.find(s => s.index === i - 1);
                    const prevDistance = prevSegment?.distance || 0;
                    if (prevDistance > 0 && hasValidPath(i - 1, i)) {
                        hasIncomingRoute = true;
                    }
                }
                
                // Afficher une carte/carto seulement si pas de trajet entrant
                if (!hasIncomingRoute) {
                    if (isCartoPoi(poi)) {
                        // POI sur plan cartographique (avec position x, y)
                        sequence.push({ type: 'carto', poi: i });
                    } else if (isCartoChildWithoutXY(poi)) {
                        // POI enfant carto sans position x/y - afficher le plan du parent
                        sequence.push({ type: 'carto', poi: i });
                    } else if (hasGeoCoords(poi)) {
                        // POI avec coordonnées géo directes
                        sequence.push({ type: 'map', poi: i });
                    } else if (getEffectiveCoords(poi)) {
                        // POI enfant avec coordonnées héritées du parent
                        sequence.push({ type: 'map', poi: i });
                    }
                }
                
                sequence.push({ type: 'details', poi: i });
                if (i < pois.length - 1) {
                    const segment = route?.segments?.find(s => s.index === i);
                    const distance = segment?.distance || 0;
                    if (distance > 0 && hasValidPath(i, i + 1)) {
                        sequence.push({ type: 'route', from: i, to: i + 1, distance });
                    }
                }
            }
        }

        function showStep() {
            const step = sequence[currentStep];
            hideAll();
            document.getElementById('btn-prev').disabled = currentStep === 0;
            document.getElementById('btn-next').disabled = currentStep === sequence.length - 1;
            if (step.type === 'home') show('slide-home');
            else if (step.type === 'overview') { renderOverview(); show('slide-overview'); }
            else if (step.type === 'map') { renderMap(step.poi); show('slide-map'); }
            else if (step.type === 'carto') { renderCarto(step.poi); show('slide-carto'); }
            else if (step.type === 'details') { renderDetails(step.poi); show('slide-details'); }
            else if (step.type === 'route') { renderRoute(step.from, step.to, step.distance); show('slide-route'); }
        }

        function goNext() { if (currentStep < sequence.length - 1) { currentStep++; showStep(); } }
        function goPrev() { if (currentStep > 0) { currentStep--; showStep(); } }
        function goHome() { currentStep = 0; showStep(); }

        function goToPoi(poiIndex) {
            const poi = pois[poiIndex];
            if (isCartoPoi(poi) || isCartoChildWithoutXY(poi)) {
                const idx = sequence.findIndex(s => s.type === 'carto' && s.poi === poiIndex);
                if (idx !== -1) { currentStep = idx; showStep(); closePoiList(); return; }
            }
            const idx = sequence.findIndex(s => s.type === 'details' && s.poi === poiIndex);
            if (idx !== -1) { currentStep = idx; showStep(); }
            closePoiList();
        }

        function hideAll() { document.querySelectorAll('.slide').forEach(s => s.classList.remove('active')); }
        function show(id) { document.getElementById(id).classList.add('active'); }

        function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight') goNext();
                if (e.key === 'ArrowLeft') goPrev();
                if (e.key === 'Escape') {
                    if (document.getElementById('poi-list-modal').classList.contains('active')) closePoiList();
                    else goHome();
                }
                if (e.key === 'l' || e.key === 'L') openPoiList();
            });
        }

        function openPoiList() {
            const content = document.getElementById('poi-list-content');
            const currentPoiIndex = getCurrentPoiIndex();
            content.innerHTML = pois.map((poi, i) => {
                const isCurrent = i === currentPoiIndex;
                const coords = getEffectiveCoords(poi);
                const parent = getParentPoi(poi);
                const meta = parent ? parent.title : (coords ? `${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}` : '');
                return `<button class="poi-list-item ${isCurrent ? 'current' : ''}" onclick="goToPoi(${i})">
                    <span class="poi-list-num">${i + 1}</span>
                    <div class="poi-list-info">
                        <div class="poi-list-name">${poi.title}</div>
                        ${meta ? `<div class="poi-list-meta">${meta}</div>` : ''}
                    </div>
                    <svg class="poi-list-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>`;
            }).join('');
            document.getElementById('poi-list-modal').classList.add('active');
            setTimeout(() => {
                const cur = content.querySelector('.current');
                if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }, 100);
        }

        function closePoiList() { document.getElementById('poi-list-modal').classList.remove('active'); }

        function getCurrentPoiIndex() {
            const step = sequence[currentStep];
            if (step && (step.type === 'map' || step.type === 'carto' || step.type === 'details')) return step.poi;
            if (step && step.type === 'route') return step.to;
            return -1;
        }

        function updateMapPhotoPosition() {
            if (!map || !mapMarkerCoords) return;
            const photoBox = document.getElementById('map-photo-box');
            const connectorLine = document.getElementById('map-connector-line');
            const container = document.getElementById('map-container');
            if (!photoBox.classList.contains('visible')) {
                connectorLine.setAttribute('x1', '0'); connectorLine.setAttribute('y1', '0');
                connectorLine.setAttribute('x2', '0'); connectorLine.setAttribute('y2', '0');
                return;
            }
            const containerRect = container.getBoundingClientRect();
            const point = map.latLngToContainerPoint([mapMarkerCoords.lat, mapMarkerCoords.lng]);
            const photoWidth = 120;
            const photoHeight = photoBox.offsetHeight || 100;
            const offset = 60;
            let photoX = point.x < containerRect.width / 2 ? point.x + offset : point.x - offset - photoWidth;
            let photoY = point.y < containerRect.height / 2 ? point.y + offset : point.y - offset - photoHeight;
            photoX = Math.max(10, Math.min(containerRect.width - photoWidth - 10, photoX));
            photoY = Math.max(10, Math.min(containerRect.height - photoHeight - 10, photoY));
            photoBox.style.left = photoX + 'px';
            photoBox.style.top = photoY + 'px';
            connectorLine.setAttribute('x1', point.x);
            connectorLine.setAttribute('y1', point.y);
            connectorLine.setAttribute('x2', photoX + photoWidth / 2);
            connectorLine.setAttribute('y2', photoY + photoHeight / 2);
        }

        // CORRECTION 2: Positionner les photos perpendiculairement à la trace
        function updateRoutePhotosPosition() {
            if (!routeMap || !routeMarkerFromCoords || !routeMarkerToCoords) return;
            const container = document.getElementById('route-map-container');
            const containerRect = container.getBoundingClientRect();
            const fromPhotoBox = document.getElementById('route-photo-from');
            const toPhotoBox = document.getElementById('route-photo-to');
            const connectorFrom = document.getElementById('route-connector-from');
            const connectorTo = document.getElementById('route-connector-to');
            const photoWidth = 120;
            const offset = 70;

            const fromPoint = routeMap.latLngToContainerPoint([routeMarkerFromCoords.lat, routeMarkerFromCoords.lng]);
            const toPoint = routeMap.latLngToContainerPoint([routeMarkerToCoords.lat, routeMarkerToCoords.lng]);

            // Calculer la direction de la trace
            const dx = toPoint.x - fromPoint.x;
            const dy = toPoint.y - fromPoint.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            // Vecteur perpendiculaire normalisé
            const perpX = -dy / len;
            const perpY = dx / len;

            // Photo FROM - côté gauche de la trace (par rapport à la direction)
            if (fromPhotoBox.classList.contains('visible')) {
                const fromPhotoHeight = fromPhotoBox.offsetHeight || 80;
                let fromX = fromPoint.x + perpX * offset - photoWidth / 2;
                let fromY = fromPoint.y + perpY * offset - fromPhotoHeight / 2;
                
                // Vérifier si on sort du conteneur, si oui, aller de l'autre côté
                if (fromX < 10 || fromX + photoWidth > containerRect.width - 10) {
                    fromX = fromPoint.x - perpX * offset - photoWidth / 2;
                    fromY = fromPoint.y - perpY * offset - fromPhotoHeight / 2;
                }
                fromX = Math.max(10, Math.min(containerRect.width - photoWidth - 10, fromX));
                fromY = Math.max(10, Math.min(containerRect.height - fromPhotoHeight - 10, fromY));
                fromPhotoBox.style.left = fromX + 'px';
                fromPhotoBox.style.top = fromY + 'px';
                connectorFrom.setAttribute('x1', fromPoint.x);
                connectorFrom.setAttribute('y1', fromPoint.y);
                connectorFrom.setAttribute('x2', fromX + photoWidth / 2);
                connectorFrom.setAttribute('y2', fromY + fromPhotoHeight / 2);
            } else {
                connectorFrom.setAttribute('x1', '0'); connectorFrom.setAttribute('y1', '0');
                connectorFrom.setAttribute('x2', '0'); connectorFrom.setAttribute('y2', '0');
            }

            // Photo TO - côté droit de la trace (opposé au FROM)
            if (toPhotoBox.classList.contains('visible')) {
                const toPhotoHeight = toPhotoBox.offsetHeight || 80;
                let toX = toPoint.x - perpX * offset - photoWidth / 2;
                let toY = toPoint.y - perpY * offset - toPhotoHeight / 2;
                
                // Vérifier si on sort du conteneur
                if (toX < 10 || toX + photoWidth > containerRect.width - 10) {
                    toX = toPoint.x + perpX * offset - photoWidth / 2;
                    toY = toPoint.y + perpY * offset - toPhotoHeight / 2;
                }
                toX = Math.max(10, Math.min(containerRect.width - photoWidth - 10, toX));
                toY = Math.max(10, Math.min(containerRect.height - toPhotoHeight - 10, toY));
                toPhotoBox.style.left = toX + 'px';
                toPhotoBox.style.top = toY + 'px';
                connectorTo.setAttribute('x1', toPoint.x);
                connectorTo.setAttribute('y1', toPoint.y);
                connectorTo.setAttribute('x2', toX + photoWidth / 2);
                connectorTo.setAttribute('y2', toY + toPhotoHeight / 2);
            } else {
                connectorTo.setAttribute('x1', '0'); connectorTo.setAttribute('y1', '0');
                connectorTo.setAttribute('x2', '0'); connectorTo.setAttribute('y2', '0');
            }
        }

        // ===== OVERVIEW MAP =====
		function renderOverview() {
			const overviewTitleEl = document.getElementById('overview-title');
			const legendEl = document.getElementById('overview-legend');
			
			if (overviewMap) {
				overviewMap.remove();
				overviewMap = null;
			}

			// Initialisation
			overviewMap = L.map('overview-map');

			L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				attribution: '© OSM'
			}).addTo(overviewMap);

			let allGeoPoints = [];
			let totalDistance = 0;
			let legendHtml = '<div class="overview-legend-title">Points d\'intérêt</div>';

			// 1. Préparer les coordonnées des POI
			const poiCoords = pois.map(p => getEffectiveCoords(p));

			// 2. Affichage des Marqueurs
			poiCoords.forEach((coords, i) => {
				if (coords) {
					allGeoPoints.push([coords.lat, coords.lng]);
					L.marker([coords.lat, coords.lng], {
						icon: L.divIcon({
							className: '',
							html: `<div class="poi-marker small">${i + 1}</div>`,
							iconSize: [30, 30],
							iconAnchor: [15, 15]
						})
					}).addTo(overviewMap).bindPopup(`<b>${pois[i].title}</b>`);

					legendHtml += `
						<div class="overview-legend-item" onclick="overviewMap.flyTo([${coords.lat}, ${coords.lng}], 17)">
							<div class="overview-legend-poi">${i + 1}</div>
							<span class="overview-legend-text">${pois[i].title}</span>
						</div>`;
				}
			});

			legendHtml += '<div class="overview-legend-title" style="margin-top: 10px;">Trajets</div>';

			// 3. Tracé des Segments (avec sécurité sur le format des données)
			for (let i = 0; i < pois.length - 1; i++) {
				const start = poiCoords[i];
				const end = poiCoords[i + 1];

				if (start && end) {
					const segmentData = route?.segments?.find(s => s.index === i);
					let rawPath = segmentData?.path || route?.segmentPaths?.[i.toString()] || [];
					
					// Conversion forcée en [lat, lng] pour éviter les bugs
					let cleanPath = rawPath.map(p => {
						if (Array.isArray(p)) return [p[0], p[1]]; // Déjà un tableau [lat, lng]
						if (p.lat !== undefined) return [p.lat, p.lng]; // C'est un objet {lat, lng}
						return null;
					}).filter(p => p !== null);

					// Si le chemin est vide ou trop court, on fait une ligne droite
					if (cleanPath.length < 2) {
						cleanPath = [[start.lat, start.lng], [end.lat, end.lng]];
					} else {
						// On s'assure que le tracé est bien connecté aux POI
						cleanPath.unshift([start.lat, start.lng]);
						cleanPath.push([end.lat, end.lng]);
					}

					const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
					const dist = segmentData?.distance || calculatePathDistance(cleanPath);
					totalDistance += dist;

					// DESSIN DE LA LIGNE (Correction ici : ajout d'un zIndex et d'un poids fort)
					L.polyline(cleanPath, {
						color: color,
						weight: 6,
						opacity: 0.8,
						lineCap: 'round',
						lineJoin: 'round'
					}).addTo(overviewMap);

					allGeoPoints.push(...cleanPath);
					addArrowToSegment(overviewMap, cleanPath, color);

					legendHtml += `
						<div class="overview-legend-item">
							<div class="overview-legend-color" style="background: ${color}"></div>
							<span class="overview-legend-text">${i+1}→${i+2} (${formatDistance(dist)})</span>
						</div>`;
				}
			}

			overviewTitleEl.innerHTML = `Vue d'ensemble <span style="color:#e07b39; font-weight:bold; margin-left:10px;">(${formatDistance(totalDistance)})</span>`;
			legendEl.innerHTML = legendHtml;

			// 4. Calcul final et affichage
			overviewTitleEl.innerHTML = `Vue d'ensemble <span style="color:#e07b39; font-weight:bold; margin-left:10px;">(${formatDistance(totalDistance)})</span>`;
			legendEl.innerHTML = legendHtml;

			// PROTECTION : On attend que le slide soit bien visible pour centrer
			setTimeout(() => {
				// 1. On force Leaflet à recalculer sa taille réelle (fondamental)
				overviewMap.invalidateSize();

				// 2. Si on a des points, on définit les limites
				if (allGeoPoints.length > 0) {
					const bounds = L.latLngBounds(allGeoPoints);
					
					// 3. fitBounds avec une marge de sécurité (padding)
					// On augmente le padding à 50px pour éviter que les marqueurs ne touchent les bords
					overviewMap.fitBounds(bounds, { 
						padding: [50, 50],
						maxZoom: 18, // Évite un zoom trop proche s'il n'y a qu'un seul point
						animate: true 
					});
				}
			}, 300); // Un délai de 300ms est idéal pour laisser la transition CSS se finir

			updateUserMarkers();
		}



		/**
		 * Calcul de distance entre points [lat, lng]
		 */
		function calculatePathDistance(path) {
			let d = 0;
			for (let i = 0; i < path.length - 1; i++) {
				d += getDistanceBetweenPoints(path[i][0], path[i][1], path[i+1][0], path[i+1][1]);
			}
			return d;
		}

		/**
		 * Flèches directionnelles améliorées
		 */
		function addArrowToSegment(mapInstance, path, color) {
			if (path.length < 2) return;
			
			// On cherche le milieu du segment pour placer la flèche
			const midIndex = Math.floor(path.length / 2);
			const p1 = path[midIndex - 1];
			const p2 = path[midIndex];

			const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * 180 / Math.PI;

			const arrowIcon = L.divIcon({
				className: '',
				html: `<div style="transform: rotate(${angle}deg); display: flex;">
						 <svg width="24" height="24" viewBox="0 0 24 24">
							<path d="M8,4 l10,8 l-10,8 l2,-8 z" fill="${color}" stroke="white" stroke-width="1.5"/>
						 </svg>
					   </div>`,
				iconSize: [24, 24],
				iconAnchor: [12, 12]
			});

			L.marker([p2[0], p2[1]], { icon: arrowIcon, interactive: false }).addTo(mapInstance);
		}

        // ===== CARTO VIEWER avec zoom/pan style Leaflet =====
        
        function initCartoControls() {
            const viewport = document.getElementById('carto-viewport');
            const zoomIn = document.getElementById('carto-zoom-in');
            const zoomOut = document.getElementById('carto-zoom-out');
            const resetBtn = document.getElementById('carto-reset');
            
            // Boutons de zoom
            zoomIn.addEventListener('click', () => cartoZoom(1.3));
            zoomOut.addEventListener('click', () => cartoZoom(0.7));
            resetBtn.addEventListener('click', cartoResetView);
            
            // Molette de souris pour zoom
            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY > 0 ? 0.9 : 1.1;
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                cartoZoomAt(factor, mouseX, mouseY);
            }, { passive: false });
            
            // Drag pour pan (souris)
            viewport.addEventListener('mousedown', cartoStartDrag);
            document.addEventListener('mousemove', cartoDrag);
            document.addEventListener('mouseup', cartoEndDrag);
            
            // Touch pour pan et pinch zoom
            viewport.addEventListener('touchstart', cartoTouchStart, { passive: false });
            viewport.addEventListener('touchmove', cartoTouchMove, { passive: false });
            viewport.addEventListener('touchend', cartoTouchEnd);
            
            // Double-clic pour zoom
            viewport.addEventListener('dblclick', (e) => {
                e.preventDefault();
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                cartoZoomAt(1.5, mouseX, mouseY);
            });
        }
        
        function cartoZoom(factor) {
            const container = document.getElementById('carto-container');
            const centerX = container.offsetWidth / 2;
            const centerY = container.offsetHeight / 2;
            cartoZoomAt(factor, centerX, centerY);
        }
        
        function cartoZoomAt(factor, pivotX, pivotY) {
            const newScale = Math.max(cartoState.minScale, Math.min(cartoState.maxScale, cartoState.scale * factor));
            if (newScale === cartoState.scale) return;
            
            // Ajuster la translation pour zoomer vers le point pivot
            const scaleChange = newScale / cartoState.scale;
            cartoState.translateX = pivotX - (pivotX - cartoState.translateX) * scaleChange;
            cartoState.translateY = pivotY - (pivotY - cartoState.translateY) * scaleChange;
            cartoState.scale = newScale;
            
            cartoApplyTransform();
            updateCartoConnector();
            updateZoomButtons();
        }
        
        function cartoResetView() {
            const container = document.getElementById('carto-container');
            const img = document.getElementById('carto-image');
            
            if (!img.naturalWidth) return;
            
            // Calculer l'échelle pour que l'image s'adapte au conteneur
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            const scaleX = containerWidth / img.naturalWidth;
            const scaleY = containerHeight / img.naturalHeight;
            const fitScale = Math.min(scaleX, scaleY, 1) * 0.95;
            
            cartoState.scale = fitScale;
            // Centrer l'image
            cartoState.translateX = (containerWidth - img.naturalWidth * fitScale) / 2;
            cartoState.translateY = (containerHeight - img.naturalHeight * fitScale) / 2;
            
            cartoApplyTransform();
            updateCartoConnector();
            updateZoomButtons();
        }
        
        function cartoStartDrag(e) {
            if (e.target.closest('.carto-photo-container') || e.target.closest('.carto-zoom-controls') || e.target.closest('.carto-reset-btn')) return;
            e.preventDefault();
            cartoState.isDragging = true;
            cartoState.startX = e.clientX;
            cartoState.startY = e.clientY;
            cartoState.startTranslateX = cartoState.translateX;
            cartoState.startTranslateY = cartoState.translateY;
        }
        
        function cartoDrag(e) {
            if (!cartoState.isDragging) return;
            const dx = e.clientX - cartoState.startX;
            const dy = e.clientY - cartoState.startY;
            cartoState.translateX = cartoState.startTranslateX + dx;
            cartoState.translateY = cartoState.startTranslateY + dy;
            cartoApplyTransform();
            updateCartoConnector();
        }
        
        function cartoEndDrag() {
            cartoState.isDragging = false;
        }
        
        function cartoTouchStart(e) {
            if (e.target.closest('.carto-photo-container')) return;
            
            if (e.touches.length === 1) {
                e.preventDefault();
                cartoState.isDragging = true;
                cartoState.startX = e.touches[0].clientX;
                cartoState.startY = e.touches[0].clientY;
                cartoState.startTranslateX = cartoState.translateX;
                cartoState.startTranslateY = cartoState.translateY;
            } else if (e.touches.length === 2) {
                e.preventDefault();
                cartoState.isDragging = false;
                cartoState.initialPinchDistance = getPinchDistance(e.touches);
                cartoState.initialScale = cartoState.scale;
            }
        }
        
        function cartoTouchMove(e) {
            if (e.touches.length === 1 && cartoState.isDragging) {
                e.preventDefault();
                const dx = e.touches[0].clientX - cartoState.startX;
                const dy = e.touches[0].clientY - cartoState.startY;
                cartoState.translateX = cartoState.startTranslateX + dx;
                cartoState.translateY = cartoState.startTranslateY + dy;
                cartoApplyTransform();
                updateCartoConnector();
            } else if (e.touches.length === 2 && cartoState.initialPinchDistance > 0) {
                e.preventDefault();
                const currentDistance = getPinchDistance(e.touches);
                const scale = (currentDistance / cartoState.initialPinchDistance) * cartoState.initialScale;
                const newScale = Math.max(cartoState.minScale, Math.min(cartoState.maxScale, scale));
                
                // Point central du pinch
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const rect = document.getElementById('carto-viewport').getBoundingClientRect();
                const pivotX = centerX - rect.left;
                const pivotY = centerY - rect.top;
                
                const scaleChange = newScale / cartoState.scale;
                cartoState.translateX = pivotX - (pivotX - cartoState.translateX) * scaleChange;
                cartoState.translateY = pivotY - (pivotY - cartoState.translateY) * scaleChange;
                cartoState.scale = newScale;
                
                cartoApplyTransform();
                updateCartoConnector();
                updateZoomButtons();
            }
        }
        
        function cartoTouchEnd(e) {
            if (e.touches.length === 0) {
                cartoState.isDragging = false;
                cartoState.initialPinchDistance = 0;
            }
        }
        
        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        function cartoApplyTransform() {
            const transformLayer = document.getElementById('carto-transform-layer');
            transformLayer.style.transform = `translate(${cartoState.translateX}px, ${cartoState.translateY}px) scale(${cartoState.scale})`;
        }
        
        function updateZoomButtons() {
            document.getElementById('carto-zoom-in').disabled = cartoState.scale >= cartoState.maxScale;
            document.getElementById('carto-zoom-out').disabled = cartoState.scale <= cartoState.minScale;
        }
        
        function updateCartoConnector() {
            if (!cartoState.hasMarker) return;
            
            const container = document.getElementById('carto-container');
            const photoContainer = document.getElementById('carto-photo-container');
            const connectorLine = document.getElementById('carto-connector-line');
            
            if (!photoContainer.classList.contains('visible')) {
                connectorLine.setAttribute('x1', '0');
                connectorLine.setAttribute('y1', '0');
                connectorLine.setAttribute('x2', '0');
                connectorLine.setAttribute('y2', '0');
                return;
            }
            
            const img = document.getElementById('carto-image');
            
            // Position du marqueur dans l'espace écran
            const markerScreenX = cartoState.translateX + cartoState.markerX * img.naturalWidth * cartoState.scale;
            const markerScreenY = cartoState.translateY + (1 - cartoState.markerY) * img.naturalHeight * cartoState.scale;
            
            // Centre de la photo
            const photoRect = photoContainer.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const photoCenterX = photoRect.left - containerRect.left + photoRect.width / 2;
            const photoCenterY = photoRect.top - containerRect.top + photoRect.height / 2;
            
            connectorLine.setAttribute('x1', markerScreenX);
            connectorLine.setAttribute('y1', markerScreenY);
            connectorLine.setAttribute('x2', photoCenterX);
            connectorLine.setAttribute('y2', photoCenterY);
        }
        
        // Drag pour la photo carto
        function initCartoPhotoDrag() {
            const photoContainer = document.getElementById('carto-photo-container');
            
            const onStart = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const touch = e.touches ? e.touches[0] : e;
                dragState = {
                    box: photoContainer,
                    startX: touch.clientX - photoContainer.offsetLeft,
                    startY: touch.clientY - photoContainer.offsetTop,
                    updateFn: updateCartoConnector
                };
                photoContainer.style.cursor = 'grabbing';
            };
            
            photoContainer.addEventListener('mousedown', onStart);
            photoContainer.addEventListener('touchstart', onStart, { passive: false });
        }

                                photoEl.onerror = () => photoContainer.classList.remove('visible');
                            }
                        }
                    }, 50);
                };
                imgEl.onerror = () => imgEl.src = '';
            }
        }
        
        function centerOnMarker() {
            if (!cartoState.hasMarker) return;
            
            const container = document.getElementById('carto-container');
            const img = document.getElementById('carto-image');
            
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            // Position du marqueur sur l'image (en pixels à l'échelle actuelle)
            const markerImgX = cartoState.markerX * img.naturalWidth * cartoState.scale;
            const markerImgY = (1 - cartoState.markerY) * img.naturalHeight * cartoState.scale;
            
            // Calculer la translation pour centrer le marqueur
            cartoState.translateX = containerWidth / 2 - markerImgX;
            cartoState.translateY = containerHeight / 2 - markerImgY;
            
            cartoApplyTransform();
        }
        
        function positionCartoPhoto() {
            const container = document.getElementById('carto-container');
            const photoContainer = document.getElementById('carto-photo-container');
            const img = document.getElementById('carto-image');
            
            if (!cartoState.hasMarker) return;
            
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            // Position écran du marqueur
            const markerScreenX = cartoState.translateX + cartoState.markerX * img.naturalWidth * cartoState.scale;
            const markerScreenY = cartoState.translateY + (1 - cartoState.markerY) * img.naturalHeight * cartoState.scale;
            
            const photoWidth = 120;
            const photoHeight = photoContainer.offsetHeight || 100;
            const offset = 60;
            
            // Décider du positionnement selon la position du marqueur
            let photoX, photoY;
            
            if (markerScreenX < containerWidth / 2) {
                // Marqueur à gauche -> photo à droite
                photoX = Math.min(containerWidth - photoWidth - 10, markerScreenX + offset);
            } else {
                // Marqueur à droite -> photo à gauche
                photoX = Math.max(10, markerScreenX - offset - photoWidth);
            }
            
            if (markerScreenY < containerHeight / 2) {
                // Marqueur en haut -> photo en bas
                photoY = Math.min(containerHeight - photoHeight - 10, markerScreenY + offset);
            } else {
                // Marqueur en bas -> photo en haut
                photoY = Math.max(10, markerScreenY - offset - photoHeight);
            }
            
            photoContainer.style.left = photoX + 'px';
            photoContainer.style.top = photoY + 'px';
            photoContainer.style.right = 'auto';
            photoContainer.style.bottom = 'auto';
        }

        function renderDetails(poiIndex) {
            const poi = pois[poiIndex];
            document.getElementById('details-num').textContent = poiIndex + 1;
            document.getElementById('details-title').textContent = poi.title;
            document.getElementById('details-photo').classList.add('hidden');
            const parentInfoEl = document.getElementById('details-parent-info');
            const parent = getParentPoi(poi);
            if (parent) {
                document.getElementById('details-parent-name').textContent = 'Dans : ' + parent.title;
                parentInfoEl.style.display = 'flex';
            } else {
                parentInfoEl.style.display = 'none';
            }
            const tagsEl = document.getElementById('details-tags');
            tagsEl.innerHTML = '';
            if (poi.tags?.length) {
                poi.tags.forEach(t => {
                    const span = document.createElement('span');
                    span.className = 'details-tag';
                    span.textContent = t;
                    tagsEl.appendChild(span);
                });
            }
            const coordsEl = document.getElementById('details-coords');
            if (hasGeoCoords(poi)) {
                coordsEl.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>${poi.lat.toFixed(5)}, ${poi.lng.toFixed(5)}`;
            } else if (isCartoPoi(poi)) {
                coordsEl.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>Position sur plan`;
            } else {
                coordsEl.innerHTML = '';
            }
            document.getElementById('details-desc').innerHTML = processDescriptionHtml(poi.descHtml);
			// Scroll vers le haut après affichage
			setTimeout(() => {
				const detailsContent = document.querySelector('.details-content');
				if (detailsContent) detailsContent.scrollTop = 0;
			}, 10);
        }

        function renderRoute(fromIndex, toIndex, distance) {
            const fromPoi = pois[fromIndex];
            const toPoi = pois[toIndex];
            document.getElementById('route-subtitle').textContent = `${fromPoi.title} → ${toPoi.title}`;
            const distanceEl = document.getElementById('route-distance');
            if (distance > 0) { distanceEl.textContent = '📍 ' + formatDistance(distance); distanceEl.style.display = 'block'; }
            else { distanceEl.style.display = 'none'; }

            const fromPhotoBox = document.getElementById('route-photo-from');
            const toPhotoBox = document.getElementById('route-photo-to');
            fromPhotoBox.classList.remove('visible');
            toPhotoBox.classList.remove('visible');
            routeMarkerFromCoords = null;
            routeMarkerToCoords = null;

            const fromCoords = getEffectiveCoords(fromPoi);
            const toCoords = getEffectiveCoords(toPoi);
            if (fromCoords) routeMarkerFromCoords = fromCoords;
            if (toCoords) routeMarkerToCoords = toCoords;

            if (fromPoi.photo) {
                const img = document.getElementById('route-photo-from-img');
                img.src = CONFIG.imagesPath + fromPoi.photo;
                document.getElementById('route-photo-from-label').textContent = fromPoi.title;
                img.onload = () => { fromPhotoBox.classList.add('visible'); setTimeout(updateRoutePhotosPosition, 100); };
                img.onerror = () => fromPhotoBox.classList.remove('visible');
            }
            if (toPoi.photo) {
                const img = document.getElementById('route-photo-to-img');
                img.src = CONFIG.imagesPath + toPoi.photo;
                document.getElementById('route-photo-to-label').textContent = toPoi.title;
                img.onload = () => { toPhotoBox.classList.add('visible'); setTimeout(updateRoutePhotosPosition, 100); };
                img.onerror = () => toPhotoBox.classList.remove('visible');
            }

            let path = null;
            const segment = route?.segments?.find(s => s.index === fromIndex);
            if (segment?.path?.length >= 2) path = segment.path;
            else path = route?.segmentPaths?.[fromIndex.toString()];

            setTimeout(() => {
                if (routeMap) { routeMap.off('move', updateRoutePhotosPosition); routeMap.off('zoom', updateRoutePhotosPosition); routeMap.remove(); routeMap = null; }
                let fullPath = [];
                if (path?.length >= 2) {
                    fullPath = [...path];
                    if (fromCoords && getDistanceBetweenPoints(fromCoords.lat, fromCoords.lng, fullPath[0][0], fullPath[0][1]) > 5)
                        fullPath.unshift([fromCoords.lat, fromCoords.lng]);
                    if (toCoords && getDistanceBetweenPoints(toCoords.lat, toCoords.lng, fullPath[fullPath.length-1][0], fullPath[fullPath.length-1][1]) > 5)
                        fullPath.push([toCoords.lat, toCoords.lng]);
                } else if (fromCoords && toCoords) {
                    fullPath = [[fromCoords.lat, fromCoords.lng], [toCoords.lat, toCoords.lng]];
                }
                if (fullPath.length < 2) return;

                routeMap = L.map('route-map').setView(fullPath[0], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(routeMap);
                const line = L.polyline(fullPath, { color: '#3b82f6', weight: 5, opacity: 0.9 }).addTo(routeMap);
                if (fromCoords) L.marker([fromCoords.lat, fromCoords.lng], { icon: L.divIcon({ className: '', html: `<div class="poi-marker">${fromIndex + 1}</div>`, iconSize: [40, 40], iconAnchor: [20, 20] }) }).addTo(routeMap);
                if (toCoords) L.marker([toCoords.lat, toCoords.lng], { icon: L.divIcon({ className: '', html: `<div class="poi-marker current">${toIndex + 1}</div>`, iconSize: [40, 40], iconAnchor: [20, 20] }) }).addTo(routeMap);
                routeMap.fitBounds(line.getBounds(), { padding: [40, 40] });
				userMarkerRoute = null;
				updateUserMarkers();
                routeMap.on('move', updateRouteConnectorsOnly);
                routeMap.on('zoom', updateRouteConnectorsOnly);
                setTimeout(updateRoutePhotosPosition, 200);
				initPhotoDrag('route-photo-from', updateRouteConnectorsOnly);
				initPhotoDrag('route-photo-to', updateRouteConnectorsOnly);
            }, 50);
        }

        function getDistanceBetweenPoints(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

		function startGeo() {
			if ('geolocation' in navigator) {
				navigator.geolocation.watchPosition(
					p => {
						userLoc = { lat: p.coords.latitude, lng: p.coords.longitude };
						updateUserMarkers();
					},
					err => console.log('Geo error:', err.message),
					{ enableHighAccuracy: true, maximumAge: 5000 }
				);
			}
		}

		function updateUserMarkers() {
			if (!userLoc) return;
			const icon = L.divIcon({
				className: '',
				html: '<div class="user-marker"></div>',
				iconSize: [18, 18],
				iconAnchor: [9, 9]
			});
			
			// Carte POI
			if (map) {
				if (userMarkerMap) {
					userMarkerMap.setLatLng([userLoc.lat, userLoc.lng]);
				} else {
					userMarkerMap = L.marker([userLoc.lat, userLoc.lng], { icon }).addTo(map);
				}
			}
			
			// Carte route
			if (routeMap) {
				if (userMarkerRoute) {
					userMarkerRoute.setLatLng([userLoc.lat, userLoc.lng]);
				} else {
					userMarkerRoute = L.marker([userLoc.lat, userLoc.lng], { icon }).addTo(routeMap);
				}
			}
            
            // Carte overview
            if (overviewMap) {
                if (userMarkerOverview) {
                    userMarkerOverview.setLatLng([userLoc.lat, userLoc.lng]);
                } else {
                    userMarkerOverview = L.marker([userLoc.lat, userLoc.lng], { icon }).addTo(overviewMap);
                }
            }
		}

		function updateMapConnectorOnly() {
			if (!map || !mapMarkerCoords) return;
			const photoBox = document.getElementById('map-photo-box');
			const connectorLine = document.getElementById('map-connector-line');
			const point = map.latLngToContainerPoint([mapMarkerCoords.lat, mapMarkerCoords.lng]);
			const photoWidth = 120;
			const photoHeight = photoBox.offsetHeight || 100;
			connectorLine.setAttribute('x1', point.x);
			connectorLine.setAttribute('y1', point.y);
			connectorLine.setAttribute('x2', photoBox.offsetLeft + photoWidth / 2);
			connectorLine.setAttribute('y2', photoBox.offsetTop + photoHeight / 2);
		}

		function updateRouteConnectorsOnly() {
			if (!routeMap) return;
			const fromBox = document.getElementById('route-photo-from');
			const toBox = document.getElementById('route-photo-to');
			const connectorFrom = document.getElementById('route-connector-from');
			const connectorTo = document.getElementById('route-connector-to');
			const photoWidth = 120;
			
			if (fromBox.classList.contains('visible') && routeMarkerFromCoords) {
				const pt = routeMap.latLngToContainerPoint([routeMarkerFromCoords.lat, routeMarkerFromCoords.lng]);
				connectorFrom.setAttribute('x1', pt.x);
				connectorFrom.setAttribute('y1', pt.y);
				connectorFrom.setAttribute('x2', fromBox.offsetLeft + photoWidth / 2);
				connectorFrom.setAttribute('y2', fromBox.offsetTop + (fromBox.offsetHeight || 80) / 2);
			}
			if (toBox.classList.contains('visible') && routeMarkerToCoords) {
				const pt = routeMap.latLngToContainerPoint([routeMarkerToCoords.lat, routeMarkerToCoords.lng]);
				connectorTo.setAttribute('x1', pt.x);
				connectorTo.setAttribute('y1', pt.y);
				connectorTo.setAttribute('x2', toBox.offsetLeft + photoWidth / 2);
				connectorTo.setAttribute('y2', toBox.offsetTop + (toBox.offsetHeight || 80) / 2);
			}
		}		

		
    </script>
